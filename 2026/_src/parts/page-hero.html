  <!-- ======================= 頁首（小 hero、同樣用弧線切分） ======================= -->
  <!-- .hero-shell 是墊在後面的 mint 色塊，讓頁首下緣變成「雙層大圓弧」 -->
  <div class="hero-shell">
  <section class="page-hero">
    <svg class="hero-art" viewBox="0 0 1440 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
      <path class="arc-teal" d="M1240 -20 C1150 80 1400 200 1300 320 L1600 320 L1600 -20 Z"/>
      <path class="arc-mint" d="M1060 -20 C960 90 1220 190 1120 320 L1250 320 C1350 190 1090 90 1190 -20 Z"/>
    </svg>
    <span class="hero-scrim" aria-hidden="true"></span>
    <div class="wrap page-hero-in">
      <span class="crumb display">MOPCON {{year}}</span>
      <h1>{{h1}}</h1>
      <p class="lead">{{lead}}</p>
    </div>
  </section>
  </div><!-- /.hero-shell -->
