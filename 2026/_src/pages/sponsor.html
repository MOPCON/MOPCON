<style>
.tier { margin: 0 0 clamp(44px, 6vw, 72px); }
.tier:last-child { margin-bottom: 0; }
.tier-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 0 0 clamp(18px, 2.4vw, 26px);
}
.tier-head h2 {
  font-size: clamp(20px, 2.5vw, 26px);
  font-weight: 700;
  margin: 0;
  color: var(--c-ink);
}
.tier-head .shape { --s: 20px; }
.tier-grid { display: grid; gap: clamp(18px, 2.4vw, 28px); }

.sp-card,
a.sp-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: var(--c-white);
  border: 1px solid var(--c-line);
  border-radius: var(--r-card);
  box-shadow: var(--shadow-1);
  transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  overflow: hidden;
  box-sizing: border-box;
  text-decoration: none;
  color: inherit;
  cursor: pointer;
}
.sp-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-2);
  border-color: var(--c-mint);
}
@media (prefers-reduced-motion: reduce) {
  .sp-card:hover { transform: none; }
}

.sp-card .ph {
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  background: var(--c-white) !important;
  border: none !important;
  border-radius: 0;
  overflow: hidden !important;
  box-sizing: border-box;
  width: 100%;
  margin: 0 auto;
}
.sp-card .ph img {
  display: block;
  width: auto !important;
  height: 100% !important;
  max-width: 100% !important;
  max-height: 100% !important;
  object-fit: contain !important;
}
.sp-card h3 {
  font-size: clamp(17px, 1.8vw, 19px);
  font-weight: 600;
  color: var(--c-ink);
  margin: 16px 0 0;
  line-height: 1.4;
  text-align: center;
}
.sp-card p {
  max-width: 38em;
  margin: 8px 0 0;
  text-align: center;
}

/* 1. 矩陣級 (Matrix) ── 最大等級：logo 等比例放大貼齊高度 */
.t-lg, .tier-grid-matrix {
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr));
}
.tier-matrix .sp-card, .sp-card-matrix {
  padding: clamp(20px, 2.8vw, 30px) 24px;
  min-height: 224px;
}
.t-lg .sp-card .ph, .tier-grid-matrix .sp-card .ph {
  height: 140px;
  min-height: 140px;
  max-width: 360px;
  padding: 4px 20px;
}

/* 2. 雲原生級 (Cloud-Native) ── 次大等級：卡片放大 10%，logo 等比例放大貼齊高度 */
.t-md, .tier-grid-cloudnative {
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 350px), 528px));
}
.tier-cloudnative .sp-card, .sp-card-cloudnative {
  max-width: 528px;
  padding: clamp(20px, 2.5vw, 26px) 20px;
  min-height: 215px;
}
.t-md .sp-card .ph, .tier-grid-cloudnative .sp-card .ph {
  height: 122px;
  min-height: 122px;
  max-width: 380px;
  padding: 4px 18px;
}

/* 3. 閘道級 (Gateway) ── 中等等級：卡片縮小 5%，logo 等比例放大貼齊高度 */
.t-sm, .tier-grid-gateway {
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 394px));
}
.tier-gateway .sp-card, .sp-card-gateway {
  max-width: 394px;
  padding: clamp(18px, 2.2vw, 22px) 18px;
  min-height: 185px;
}
.t-sm .sp-card .ph, .tier-grid-gateway .sp-card .ph {
  height: 99px;
  min-height: 99px;
  max-width: 323px;
  padding: 4px 16px;
}

/* 4. 節點級 (Node) ── 最小等級：卡片放大 10%，logo 等比例放大高度為卡片高度 */
.t-xs, .tier-grid-node {
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 378px));
}
.tier-node .sp-card, .sp-card-node {
  max-width: 378px;
  padding: clamp(16px, 1.8vw, 20px) 16px;
  min-height: 182px;
}
.t-xs .sp-card .ph, .tier-grid-node .sp-card .ph {
  height: 98px;
  min-height: 98px;
  max-width: 315px;
  padding: 4px 14px;
}
</style>
