  <!-- ======================= 議程時刻表 ======================= -->
  <section class="band band-white arc-bot agenda2-band" aria-labelledby="agenda2BandTitle">
    <div class="wrap">
      <div class="sec-head">
        <span class="eyebrow">AGENDA TIMETABLE</span>
        <h2 id="agenda2BandTitle">大會議程表</h2>
        <p class="lead">單日三軌並行，點擊各場議程可查看完整內容與講者介紹。</p>
      </div>

      <!-- 行動版會議廳切換 Tab（桌機版自動隱藏） -->
      <div class="ag2-hall-tabs-wrap" role="region" aria-label="會議廳切換">
        <ul class="chip-set ag2-hall-tabs" id="ag2HallTabs" role="tablist" aria-label="會議廳切換">
          <li><button type="button" class="chip chip-A" data-hall="R1" role="tab" aria-selected="true"><span class="tag-dot" aria-hidden="true"></span>R1 (1F)</button></li>
          <li><button type="button" class="chip chip-B" data-hall="R2" role="tab" aria-selected="false"><span class="tag-dot" aria-hidden="true"></span>R2 (B1F-R)</button></li>
          <li><button type="button" class="chip chip-C" data-hall="R3" role="tab" aria-selected="false"><span class="tag-dot" aria-hidden="true"></span>R3 (B1F-L)</button></li>
        </ul>
      </div>

      <div class="agenda2-table-wrap" role="region" aria-label="議程時刻表" tabindex="0">
        <table class="agenda2-table" id="agenda2Table" role="table" aria-labelledby="agenda2BandTitle" data-active-hall="R1">
          <thead>
            <tr>
              <th scope="col" class="ag2-th-time">開始時間</th>
              <th scope="col" class="ag2-th-hall" data-hall="R1">R1 (1F)</th>
              <th scope="col" class="ag2-th-hall" data-hall="R2">R2 (B1F-R)</th>
              <th scope="col" class="ag2-th-hall" data-hall="R3">R3 (B1F-L)</th>
            </tr>
          </thead>
          <tbody id="agenda2Body"></tbody>
        </table>
      </div>
      <p class="tl-note">※ Unconf 為場外自由交流互動（每場約 20～40 分鐘，於各休息與交流時段進行）。</p>
      <noscript><p class="tl-empty">議程資料由 assets/js/data.js 載入，需要開啟 JavaScript 才看得到。</p></noscript>
    </div>
  </section>

  <!-- 議程完整資訊彈出視窗（Modal） -->
  <div class="spk-modal" id="speakerModal" hidden role="dialog" aria-modal="true" aria-labelledby="spkModalName">
    <div class="spk-modal-backdrop" id="speakerModalBackdrop" tabindex="-1"></div>
    <div class="spk-modal-dialog">
      <button type="button" class="spk-modal-close" id="speakerModalClose" aria-label="關閉視窗">&times;</button>
      <div class="spk-modal-body" id="speakerModalBody"></div>
    </div>
  </div>
