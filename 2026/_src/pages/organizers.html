<!--#include parts/page-hero.html -->

<style>
.org-sec{margin:0 0 clamp(44px,6vw,72px)}
.org-sec:last-child{margin-bottom:0}
.org-sec-head{display:flex;align-items:center;gap:12px;margin:0 0 clamp(18px,2.4vw,26px)}
.org-sec-head h3{font-size:clamp(20px,2.5vw,26px);font-weight:700;margin:0;color:var(--c-ink)}
.org-sec-head .shape{--s:20px}
.org-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:clamp(18px,2.4vw,28px)}
.org-card{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:clamp(28px,3.5vw,36px) 24px;background:var(--c-white);border:1px solid var(--c-line);border-radius:var(--r-card);min-height:224px;box-shadow:var(--shadow-1);transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.org-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-2);border-color:var(--c-mint)}
.org-logo-wrap{height:96px;width:100%;max-width:240px;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.org-logo-wrap:last-child{margin-bottom:0}
.org-logo-wrap img{max-height:84px;max-width:210px;width:auto;height:auto;object-fit:contain}
.org-card-name{font-size:clamp(17px,1.8vw,19px);font-weight:600;color:var(--c-ink);margin:0;line-height:1.4}
@media (prefers-reduced-motion:reduce){.org-card:hover{transform:none}}
</style>

  <!-- ======================= 主辦單位分區 ======================= -->
  <section class="band band-white arc-bot" aria-labelledby="org-main-t">
    <img class="motif motif-dna-r" src="assets/img/motif-dna-teal.svg" alt="" aria-hidden="true" width="200" height="640">
    <div class="wrap">
      <div class="sec-head">
        <span class="eyebrow">ORGANIZER</span>
        <h2 id="org-main-t">主辦單位</h2>
        <!-- <p class="lead">濁水溪以南規模最大的科技年會，透過社群驅動與融合產官學資源將前沿科技在南台灣交流激盪。</p> -->
      </div>

      <!-- 1. 指導單位 -->
      <section class="org-sec" aria-labelledby="org-advisor-t">
        <div class="org-sec-head">
          <span class="shape shape-hex" aria-hidden="true"></span>
          <h3 id="org-advisor-t">指導單位</h3>
        </div>
        <div class="org-grid">
            <a href="https://www.bip.gov.tw/">
              <article class="org-card">
                <div class="org-logo-wrap">
                  <img src="assets/img/gov-bip-logo.png" alt="經濟部產業園區管理局" loading="lazy">
                </div>
                <span class="org-card-name">經濟部產業園區管理局</span>
              </article>
            </a>
        </div>
      </section>

      <!-- 2. 主辦法人 -->
      <section class="org-sec" aria-labelledby="org-legal-t">
        <div class="org-sec-head">
          <span class="shape shape-ring" aria-hidden="true"></span>
          <h3 id="org-legal-t">主辦法人</h3>
        </div>
        <div class="org-grid">
            <a href="https://taic.info/">
              <article class="org-card">
                <div class="org-logo-wrap">
                  <img src="https://mopcon.org/2024/assets/community/taic.webp" alt="臺灣產學策進會" loading="lazy">
                </div>
                <span class="org-card-name">臺灣產學策進會</span>
              </article>
            </a>
            <a href="https://ksda.tw/">
              <article class="org-card">
                <div class="org-logo-wrap">
                  <img src="https://mopcon.org/2024/assets/community/ksda.webp" alt="KSDA" loading="lazy">
                </div>
                <span class="org-card-name">KSDA</span>
              </article>
            </a>
        </div>
      </section>

      <!-- 3. 主辦社群 -->
      <section class="org-sec" aria-labelledby="org-comm-t">
        <div class="org-sec-head">
          <span class="shape shape-sq" aria-hidden="true"></span>
          <h3 id="org-comm-t">主辦社群</h3>
        </div>
        <div class="org-grid">
            <a href="./index.html">
              <article class="org-card">
                <div class="org-logo-wrap">
                  <img src="assets/img/logo-stack-ink.svg" alt="MOPCON 社群" loading="lazy">
                </div>
                <!-- <span class="org-card-name">MOPCON 社群</span> -->
              </article>
            </a>
            <a href="https://2026.jsdc.tw/">
              <article class="org-card">
                <div class="org-logo-wrap">
                  <img src="assets/img/JSDC.svg" alt="JSDC 社群" loading="lazy">
                </div>
                <!-- <span class="org-card-name">JSDC 社群</span> -->
              </article>
            </a>
        </div>
      </section>

    </div>
  </section>

  <!-- ======================= 聯絡合作 ======================= -->
  <section class="band band-teal on-teal cta-band arc-bot" aria-labelledby="cta-t">
    <div class="wrap">
      <h2 id="cta-t">與 MOPCON 攜手合作</h2>
      <p>歡迎各界社群、企業與教育機構與我們交流合作，共同活絡南台灣科技生態圈。</p>
      <div class="btn-row is-center">
        <a class="btn btn-amber" href="mailto:{{email}}">聯絡我們</a>
        <a class="btn btn-w" href="index.html">大會簡介</a>
      </div>
    </div>
  </section>
